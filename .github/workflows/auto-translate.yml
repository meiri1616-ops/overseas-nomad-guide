name: Auto Multi-Language Sync

on:
  workflow_dispatch: # 支持在 GitHub 后台手动一键点击运行
  push:
    paths:
      - 'README.md'      # 修改中文主页时自动触发同步
      - 'docs/*.md'      # 修改任何中文子章节时自动触发同步

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须开启写入权限，用于保存多语言主页与所有子章节

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Auto Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_translate.py

      - name: Commit and Push Translated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 同时添加所有多语言主页以及 docs 目录下的所有外语子章节
          git add README_*.md docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-sync all chapters and languages via Gemini [skip ci]" && git push)
